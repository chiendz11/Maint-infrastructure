name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  required:
    name: CI / required
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - run: python scripts/source_policy.py
    - name: Install locked local source-check dependencies
      run: python -m pip install -r local/requirements.lock
    - name: Check local contracts and protect AWS source
      run: python -m localdev.checks
    - name: Private-state and source-provenance tests without a cluster
      run: python -m unittest discover -s local/tests -p 'test_*.py' -v
    - name: Read the reviewed application revision
      id: app_source
      run: |
        python - <<'PYTHON'
        import json, os, re
        from pathlib import Path
        lock = json.loads(Path("local/versions/app-source.lock.json").read_text())
        sha = lock["source_git_sha"]
        assert lock["source_repository"] == "chiendz11/MaintAI"
        assert re.fullmatch(r"[0-9a-f]{40}|[0-9a-f]{64}", sha)
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write("sha=" + sha + "\n")
        PYTHON
    - name: Check out the pinned public application source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: chiendz11/MaintAI
        ref: ${{ steps.app_source.outputs.sha }}
        path: .ci-app
        persist-credentials: false
    - name: Verify application Git revision and reviewed file hashes
      run: python -m localdev.checks --app-root .ci-app
