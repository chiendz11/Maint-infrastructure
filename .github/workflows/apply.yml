name: terraform-apply
'on':
  workflow_dispatch:
    inputs:
      root:
        description: Apply one reviewed Terraform root in documented order
        type: choice
        options:
        - bootstrap
        - domain
        - platform
        - argocd
        required: true
      expected_main_sha:
        description: Exact reviewed main commit
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: maintai-production-infrastructure
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_INFRA_AUTOMATION == 'true'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 90
    env:
      TF_IN_AUTOMATION: 'true'
      TF_ROOT: ${{ inputs.root }}
      TFVARS_JSON: ${{ vars[format('TFVARS_{0}_JSON', inputs.root)] }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: main
        persist-credentials: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.15.6
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
      with:
        role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Apply refreshed saved plan
      run: python scripts/terraform_run.py apply
