name: terraform-plan
'on':
  pull_request: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: maintai-terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  plan:
    if: vars.ENABLE_INFRA_AUTOMATION == 'true' && github.event.pull_request.head.repo.full_name
      == github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        root:
        - bootstrap
        - domain
        - platform
    env:
      TF_IN_AUTOMATION: 'true'
      TF_ROOT: ${{ matrix.root }}
      TFVARS_JSON: ${{ vars[format('TFVARS_{0}_JSON', matrix.root)] }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.15.6
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
      with:
        role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Plan selected root
      run: python scripts/terraform_run.py plan
