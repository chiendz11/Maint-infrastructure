name: platform-handoff
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_INFRA_AUTOMATION == 'true'
    runs-on: ubuntu-24.04
    environment: prod
    env:
      TF_ROOT: platform
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      GITHUB_APP_ID: ${{ vars.PLATFORM_PUBLISHER_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.PLATFORM_PUBLISHER_INSTALLATION_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_PUBLISHER_PRIVATE_KEY }}
      GITHUB_TARGET_REPOSITORY: chiendz11/MaintAI-gitops
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: main
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - run: pip install -r requirements.txt
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: 1.15.6
        terraform_wrapper: false
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
      with:
        role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Read saved platform outputs and dispatch contract
      run: python scripts/dispatch_platform.py
