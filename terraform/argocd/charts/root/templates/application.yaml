apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maintai-root
  namespace: {{ .Release.Namespace }}
spec:
  project: default
  source:
    repoURL: {{ required "repository is required" .Values.repository | quote }}
    targetRevision: {{ required "revision is required" .Values.revision | quote }}
    path: applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
