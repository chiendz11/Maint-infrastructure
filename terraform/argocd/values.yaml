crds:
  install: true
  keep: true
configs:
  cm:
    admin.enabled: false
    exec.enabled: false
    application.resourceTrackingMethod: annotation
    resource.customizations.health.argoproj.io_Application: "hs = {}\nhs.status =\
      \ \"Progressing\"\nhs.message = \"Waiting for child Application\"\nif obj.status\
      \ ~= nil then\n  if obj.status.health ~= nil then hs = obj.status.health end\n\
      \  if obj.status.sync ~= nil and obj.status.sync.status ~= \"Synced\" then\n\
      \    hs.status = \"Progressing\"\n  end\nend\nreturn hs\n"
  params:
    controller.status.processors: '5'
    controller.operation.processors: '3'
    controller.kubectl.parallelism.limit: '5'
  rbac:
    policy.default: ''
    policy.csv: 'g, maintai-platform-admins, role:admin

      '
dex:
  enabled: false
controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 2Gi
server:
  replicas: 1
  service:
    type: ClusterIP
repoServer:
  replicas: 1
redis-ha:
  enabled: false
